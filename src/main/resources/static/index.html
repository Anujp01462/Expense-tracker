<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense & Budget Tracker</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            min-height: 100vh;
            padding: 30px 15px;
        }
        .main-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
        }
        .summary-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.2s ease;
        }
        .summary-card:hover {
            border-color: #cbd5e1;
            transform: translateY(-2px);
        }
        .badge-category {
            background-color: #f1f5f9;
            color: #475569;
            border: 1px solid #e2e8f0;
            font-weight: 500;
        }
        .badge-income {
            background-color: #dcfce7;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }
        .badge-expense {
            background-color: #fee2e2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }
        .table > tbody > tr > td {
            vertical-align: middle;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold text-dark mb-1"><i class="fa-solid fa-wallet text-primary me-2"></i>Expense & Budget Tracker</h3>
            <p class="text-secondary small mb-0">Spring Boot REST API + Light Theme jQuery Interface</p>
        </div>
        <button class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#expenseModal" id="addBtn">
            <i class="fa-solid fa-plus me-1"></i> Add Transaction
        </button>
    </div>

    <!-- Summary Widgets -->
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="summary-card">
                <div class="small text-secondary fw-semibold mb-1">Total Income</div>
                <div class="fs-4 fw-bold text-success" id="sumIncome">₹0.00</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="summary-card">
                <div class="small text-secondary fw-semibold mb-1">Total Expenses</div>
                <div class="fs-4 fw-bold text-danger" id="sumExpense">₹0.00</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="summary-card">
                <div class="small text-secondary fw-semibold mb-1">Net Balance</div>
                <div class="fs-4 fw-bold text-primary" id="sumBalance">₹0.00</div>
            </div>
        </div>
    </div>

    <!-- Transactions Main Card -->
    <div class="main-card p-4">
        <div class="row g-2 mb-3">
            <div class="col-md-6">
                <select id="typeFilter" class="form-select">
                    <option value="ALL">All Types (Income & Expense)</option>
                    <option value="EXPENSE">Expenses Only</option>
                    <option value="INCOME">Income Only</option>
                </select>
            </div>
            <div class="col-md-6">
                <select id="categoryFilter" class="form-select">
                    <option value="ALL">All Categories</option>
                    <option value="Food">Food & Dining</option>
                    <option value="Transport">Transport</option>
                    <option value="Utilities">Utilities & Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Salary">Salary / Income</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Type</th>
                        <th class="text-end">Amount</th>
                        <th class="text-end">Actions</th>
                    </tr>
                </thead>
                <tbody id="expenseTableBody">
                    <tr>
                        <td colspan="6" class="text-center py-4 text-secondary">Loading transaction records...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
            <div class="modal-header border-bottom">
                <h5 class="modal-title fw-bold text-dark" id="modalTitle"><i class="fa-solid fa-receipt text-primary me-2"></i>Add Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="expenseForm">
                <div class="modal-body">
                    <input type="hidden" id="expenseId">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary">Title / Description</label>
                        <input type="text" id="expenseTitle" class="form-control" placeholder="e.g. Grocery store, Client payment" required>
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Type</label>
                            <select id="expenseType" class="form-select" required>
                                <option value="EXPENSE" selected>Expense</option>
                                <option value="INCOME">Income</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Category</label>
                            <select id="expenseCategory" class="form-select" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Utilities">Utilities</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Salary">Salary</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-2">
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Amount (₹)</label>
                            <input type="number" id="expenseAmount" class="form-control" min="0.01" step="0.01" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-semibold text-secondary">Date</label>
                            <input type="date" id="expenseDate" class="form-control" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-top bg-light">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary btn-sm fw-semibold">Save Transaction</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- jQuery & Bootstrap JS -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
$(document).ready(function() {
    const API_URL = '/api/expenses';
    const expenseModal = new bootstrap.Modal(document.getElementById('expenseModal'));

    // Set today as default date
    const today = new Date().toISOString().split('T')[0];
    $('#expenseDate').val(today);

    function loadSummary() {
        $.get(API_URL + '/summary', function(summary) {
            $('#sumIncome').text('₹' + summary.totalIncome.toLocaleString('en-IN', {minimumFractionDigits: 2}));
            $('#sumExpense').text('₹' + summary.totalExpense.toLocaleString('en-IN', {minimumFractionDigits: 2}));
            $('#sumBalance').text('₹' + summary.balance.toLocaleString('en-IN', {minimumFractionDigits: 2}));
            if (summary.balance < 0) {
                $('#sumBalance').removeClass('text-primary text-success').addClass('text-danger');
            } else {
                $('#sumBalance').removeClass('text-danger').addClass('text-primary');
            }
        });
    }

    function loadExpenses() {
        const type = $('#typeFilter').val();
        const category = $('#categoryFilter').val();
        let url = API_URL + '?type=' + encodeURIComponent(type) + '&category=' + encodeURIComponent(category);

        $.get(url, function(expenses) {
            if (!expenses || expenses.length === 0) {
                $('#expenseTableBody').html('<tr><td colspan="6" class="text-center py-4 text-secondary">No transactions found.</td></tr>');
                return;
            }
            let rows = '';
            expenses.forEach(function(e) {
                const isIncome = e.type === 'INCOME';
                rows += `
                    <tr>
                        <td class="text-secondary small">${e.date}</td>
                        <td class="fw-semibold text-dark">${e.title}</td>
                        <td><span class="badge badge-category px-2 py-1">${e.category}</span></td>
                        <td><span class="badge ${isIncome ? 'badge-income' : 'badge-expense'} px-2 py-1">${e.type}</span></td>
                        <td class="text-end fw-bold ${isIncome ? 'text-success' : 'text-danger'}">
                            ${isIncome ? '+' : '-'} ₹${e.amount.toLocaleString('en-IN', {minimumFractionDigits: 2})}
                        </td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-secondary edit-btn me-1" data-id="${e.id}"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${e.id}"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            $('#expenseTableBody').html(rows);
        });
        loadSummary();
    }

    $('#addBtn').on('click', function() {
        $('#modalTitle').html('<i class="fa-solid fa-receipt text-primary me-2"></i>Add Transaction');
        $('#expenseId').val('');
        $('#expenseForm')[0].reset();
        $('#expenseDate').val(today);
    });

    $('#expenseForm').on('submit', function(e) {
        e.preventDefault();
        const id = $('#expenseId').val();
        const expense = {
            title: $('#expenseTitle').val().trim(),
            type: $('#expenseType').val(),
            category: $('#expenseCategory').val(),
            amount: parseFloat($('#expenseAmount').val()),
            date: $('#expenseDate').val()
        };

        if (id) {
            $.ajax({
                url: API_URL + '/' + id,
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(expense),
                success: function() {
                    expenseModal.hide();
                    loadExpenses();
                }
            });
        } else {
            $.ajax({
                url: API_URL,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(expense),
                success: function() {
                    expenseModal.hide();
                    loadExpenses();
                }
            });
        }
    });

    $(document).on('click', '.edit-btn', function() {
        const id = $(this).data('id');
        $.get(API_URL + '/' + id, function(e) {
            $('#modalTitle').html('<i class="fa-solid fa-pen text-primary me-2"></i>Edit Transaction');
            $('#expenseId').val(e.id);
            $('#expenseTitle').val(e.title);
            $('#expenseType').val(e.type);
            $('#expenseCategory').val(e.category);
            $('#expenseAmount').val(e.amount);
            $('#expenseDate').val(e.date);
            expenseModal.show();
        });
    });

    $(document).on('click', '.delete-btn', function() {
        const id = $(this).data('id');
        if (!confirm('Are you sure you want to delete this transaction?')) return;
        $.ajax({
            url: API_URL + '/' + id,
            type: 'DELETE',
            success: function() {
                loadExpenses();
            }
        });
    });

    $('#typeFilter, #categoryFilter').on('change', function() {
        loadExpenses();
    });

    loadExpenses();
});
</script>

</body>
</html>
